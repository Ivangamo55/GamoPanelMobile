   # Kotlin/Native para iOS SOLO compila en macOS: este flujo genera
   # ComposeApp.xcframework en un runner macOS de GitHub.
   name: ios-framework
   on: workflow_dispatch   # Ejecución manual desde la pestaña Actions.
   jobs:
     build:
       runs-on: macos-15
       steps:
         - uses: actions/checkout@v4
         - uses: actions/setup-java@v4
           with: { distribution: zulu, java-version: 17 }
         - uses: gradle/actions/setup-gradle@v4
           with: { gradle-version: 8.14.3 }   # Instala Gradle sin wrapper.
         - run: gradle :composeApp:assembleComposeAppReleaseXCFramework
         - uses: actions/upload-artifact@v4
           with:
             name: ComposeApp.xcframework
             path: composeApp/build/XCFrameworks/release/ComposeApp.xcframework